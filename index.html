<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Absensi</title>
  <meta name="description" content="Portal Absensi & Klaim Sertifikat." />
  
  <!-- Hanya load 1 font untuk mempercepat loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1e40af;
      --bg-light: #f8fafc;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --white: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif; /* Fallback ke font sistem agar lebih cepat */
      background: var(--bg-light);
      color: var(--text-dark);
      overflow: hidden;
    }

    /* --- NAVBAR (Disederhanakan untuk performa) --- */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 60px;
      background: var(--white); /* Hilangkan blur agar lebih ringan */
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 100;
    }

    .nav-brand { display: flex; align-items: center; gap: 10px; }

    .logo-circle {
      width: 36px; height: 36px;
      background: var(--primary);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }

    .nav-title { font-weight: 700; font-size: 16px; }
    .nav-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 500; }

    .nav-badge {
      padding: 5px 10px;
      background: #ecfdf5; color: #059669;
      border-radius: 20px;
      font-size: 11px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }

    .dot {
      width: 7px; height: 7px;
      background: #10b981; border-radius: 50%;
    }

    /* --- LOADING SCREEN --- */
    #loader {
      position: fixed;
      inset: 60px 0 0 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      background: var(--bg-light);
      z-index: 50;
    }

    .loader-icon {
      width: 40px; height: 40px;
      border: 4px solid #e2e8f0;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text { font-weight: 600; font-size: 14px; }

    /* --- IFRAME WRAPPER --- */
    #frame-wrapper {
      position: fixed;
      top: 60px; left: 0;
      width: 100%; height: calc(100% - 60px);
      background: var(--white);
    }

    iframe#app {
      width: 100%; height: 100%;
      border: 0; display: block;
    }

    /* --- FALLBACK UI --- */
    #fallback {
      position: fixed; inset: 60px 0 0 0;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; text-align: center;
      background: var(--bg-light);
    }

    .fallback-card {
      background: var(--white);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      max-width: 420px; width: 100%;
      border-top: 5px solid var(--primary);
    }

    .fallback-icon {
      width: 60px; height: 60px;
      background: #eff6ff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px auto;
    }

    .fallback-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .fallback-card p { font-size: 14px; line-height: 1.5; color: var(--text-muted); margin-bottom: 24px; }

    .btn-primary {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 14px;
      background: var(--primary); color: var(--white);
      border-radius: 10px; text-decoration: none;
      font-weight: 600; font-size: 15px;
    }
    .btn-primary:hover { background: var(--primary-dark); }

    @media (max-width: 640px) {
      .nav-subtitle { display: none; }
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-brand">
      <div class="logo-circle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <div>
        <div class="nav-title">Portal Absensi</div>
        <div class="nav-subtitle">Sistem Digital</div>
      </div>
    </div>
    
    <div class="nav-badge">
      <span class="dot"></span>
      <span>Server Aktif</span>
    </div>
  </nav>

  <div id="loader">
    <div class="loader-icon"></div>
    <div class="loader-text">Memuat Portal...</div>
  </div>

  <div id="frame-wrapper">
    <iframe
      id="app"
      src="https://script.google.com/macros/s/AKfycbxm6M6zKgfs-kVv8F2XpVZcHnL1VJ3nazRiwTar4z0FTLlPZIyeT-AVr0zk27PJNohTpg/exec"
      title="Portal Absensi Digital"
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
      allow="downloads"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-downloads allow-modals"
    ></iframe>
  </div>

  <div id="fallback" role="alert">
    <div class="fallback-card">
      <div class="fallback-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <path d="M9 15h6"/><path d="M9 11h6"/>
        </svg>
      </div>
      <h2>Validasi & Unduh Sertifikat</h2>
      <p>Demi keamanan dan kelancaran proses pengunduhan berkas PDF, sistem akan membuka halaman sertifikat pada tab baru.</p>
      <a id="fallback-link" href="https://script.google.com/macros/s/AKfycbxm6M6zKgfs-kVv8F2XpVZcHnL1VJ3nazRiwTar4z0FTLlPZIyeT-AVr0zk27PJNohTpg/exec" target="_blank" rel="noopener noreferrer" class="btn-primary">
        Buka & Download Sertifikat
      </a>
    </div>
  </div>

  <script>
    (function () {
      const GAS_URL = "https://script.google.com/macros/s/AKfycbxm6M6zKgfs-kVv8F2XpVZcHnL1VJ3nazRiwTar4z0FTLlPZIyeT-AVr0zk27PJNohTpg/exec";
      const loader = document.getElementById('loader');
      const frame = document.getElementById('app');
      const fallback = document.getElementById('fallback');
      let loaded = false;

      frame.addEventListener('load', function () {
        loaded = true;
        loader.style.display = 'none';
      });

      // Timeout 8 detik
      setTimeout(function () {
        if (!loaded) {
          loader.style.display = 'none';
          fallback.style.display = 'flex';
        }
      }, 8000);

      frame.addEventListener('error', function () {
        loader.style.display = 'none';
        fallback.style.display = 'flex';
      });

      document.getElementById('fallback-link').setAttribute('href', GAS_URL);
    })();
  </script>
</body>
</html>
